name: Android runtime test

on:
  workflow_dispatch:

jobs:
  native-deps:
    uses: ./.github/workflows/native-deps.yml

  runtime-test:
    needs: native-deps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download native dependencies
        uses: actions/download-artifact@v4
        with:
          name: native-deps-${{ github.sha }}
          path: /tmp/native-deps

      - name: Install native dependencies
        run: |
          mkdir -p src/android/app/src/main/assets src/android/app/src/main/jniLibs/arm64-v8a src/android/app/libs
          cp /tmp/native-deps/assets/proot-aarch64 src/android/app/src/main/assets/
          cp /tmp/native-deps/assets/magpie-linux-arm64 src/android/app/src/main/assets/
          cp /tmp/native-deps/jniLibs/arm64-v8a/libproot.so src/android/app/src/main/jniLibs/arm64-v8a/
          cp /tmp/native-deps/libs/rclone.aar src/android/app/libs/rclone.aar
          find /usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt -path '*sysroot/usr/lib/aarch64-linux-android' -type d -print0 | while IFS= read -r -d '' d; do cp /tmp/native-deps/libunwind.a "$d/libunwind.a"; done

      - name: Run emulator and verify Magpie
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            cd src/android && ./gradlew :app:assembleRelease --parallel --stacktrace && APK=app/build/outputs/apk/release/app-release.apk && test -s "$APK" && adb install -r "$APK" && adb shell am start -n com.openminis.app/.MainActivity && sleep 30 && adb logcat -d | grep -Ei "magpie|3425|PRoot" > "$GITHUB_WORKSPACE/magpie-log.txt"; adb forward tcp:13425 tcp:3425; curl -sS -m 10 http://127.0.0.1:13425/v1/models > "$GITHUB_WORKSPACE/magpie-response.txt" 2>&1 || echo "magpie not responding" >> "$GITHUB_WORKSPACE/magpie-response.txt"; cat "$GITHUB_WORKSPACE/magpie-response.txt"

      - name: Upload logcat and response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magpie-runtime-logs
          path: |
            magpie-log.txt
            magpie-response.txt
