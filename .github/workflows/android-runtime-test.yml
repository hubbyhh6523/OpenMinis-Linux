name: Android runtime test

on:
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run emulator and verify Magpie
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            bash -c '
              cd src/android
              ./gradlew :app:assembleRelease --parallel --stacktrace
              APK=app/build/outputs/apk/release/app-release.apk
              echo "APK=$APK"
              test -s "$APK" || { echo "APK not found at $APK"; exit 1; }
              adb install -r "$APK"
              adb shell am start -n com.openminis.linux/.MainActivity
              sleep 30
              adb logcat -d | grep -Ei "magpie|3425|PRoot" > magpie-log.txt || true
              adb forward tcp:13425 tcp:3425
              curl -sS -m 10 http://127.0.0.1:13425/v1/models > magpie-response.txt 2>&1 || echo "magpie not responding" >> magpie-response.txt
              cat magpie-response.txt
            '

      - name: Upload logcat and response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magpie-runtime-logs
          path: |
            magpie-log.txt
            magpie-response.txt
